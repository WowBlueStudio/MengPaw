# ── Android ────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ── Gradle daemon & caching ────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# R8 处理 material-icons 巨型库需大堆 (系统 15.7GB); 内存不足是 R8 慢主因 (v0.44.x 实测)
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 构建参数一致性铁律 (v0.44.3 实证): 缓存复用依赖命令行参数稳定。
# 命令行参数漂移 (-P/--max-workers 等时有时无) → configuration cache 失效 → 全量重编。
# 固定用: ./gradlew :mengpaw-shell:assembleRelease --offline --build-cache --console=plain
# (无其他 -P/--max-workers 参数; browser 仓库才需要 -Pmengpaw.useLocal=true)

# ── Kotlin ─────────────────────────────────────────────
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m

# ── Project version (single source of truth) ───────────
mengpaw.version=0.45.1

# ── Maven/JitPack publish group (shared foundation) ─────
# 共享地基 (kernel/core/design-system) 发布用 groupId。
# JitPack 构件坐标: <mengpaw.group>:<module>:<tag>
# 注意: 点连接 com.github.WowBlueStudio.MengPaw (非冒号)
mengpaw.group=com.github.WowBlueStudio.MengPaw
