# ── Android ────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ── Gradle daemon & caching ────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ── Kotlin ─────────────────────────────────────────────
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m

# ── Project version (single source of truth) ───────────
mengpaw.version=0.44.3

# ── Maven/JitPack publish group (shared foundation) ─────
# 共享地基 (kernel/core/design-system) 发布用 groupId。
# JitPack 构件坐标: <mengpaw.group>:<module>:<tag>
# 注意: 点连接 com.github.WowBlueStudio.MengPaw (非冒号)
mengpaw.group=com.github.WowBlueStudio.MengPaw
