<html lang="zh-CN">
<head>

<!-- 目录按钮/抽屉: 导航形式与动画参考 md-reader table-of-contents (markdown-it-table-of-contents 嵌套结构) -->
<button type="button" class="toc-btn" id="toc-btn" hidden aria-label="目录" title="目录">
  <svg class="icon-toc" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M2 3.5h12v1.5H2V3.5zm0 3.75h12v1.5H2v-1.5zM2 11h12v1.5H2V11zM1 4a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm0 4a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm0 4a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/></svg>
</button>
<div class="toc-mask" id="toc-mask" hidden></div>
<nav class="toc-panel" id="toc-panel" hidden aria-label="目录">
  <div class="toc-panel-header">
    <span class="toc-title">目录</span>
    <button type="button" class="toc-close" id="toc-close" aria-label="关闭目录">
      <svg class="icon-close" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
    </button>
  </div>
  <div class="toc-body" id="toc-body"></div>
</nav>
<script src="hljs.min.js"></script>
<script src="viewer.js"></script>
